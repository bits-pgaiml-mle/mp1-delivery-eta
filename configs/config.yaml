project:
  name: mp1-delivery-eta
  flavor: A
  course: PCAM ZC412
  target: eta_minutes

data:
  raw_path: data/raw/trips.csv
  processed_path: data/processed/trips_features.csv
  sample_size: 2000
  random_seed: 42

features:
  categorical:
    - weather
    - traffic_level
    - pickup_zone
    - dropoff_zone
  numeric:
    - distance_km
    - pickup_hour
    - is_weekend
    - passenger_count

training:
  test_size: 0.2
  models:
    - linear_regression
    - hist_gradient_boosting
  mlflow_experiment: delivery-eta

serving:
  host: 0.0.0.0
  port: 8000
  model_path: models/best_model.joblib

monitoring:
  prediction_log: monitoring/logs/predictions.csv
  drift_report: reports/drift_report.md
  mae_retrain_threshold: 8.0
